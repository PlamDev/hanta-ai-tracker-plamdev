<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>VN Maritime Style Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #071018;
}

#map {
    width: 100%;
    height: 100%;
}

/* Tooltip tên đảo */
.island-label {
    background: rgba(0,0,0,0.0);
    border: none;
    box-shadow: none;
    color: #7fdcff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 6px #00bfff;
}

/* Attribution */
.leaflet-control-attribution {
    background: rgba(0,0,0,0.4);
    color: #8aa;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
    zoomControl: true
}).setView([15.8, 111.5], 5);

/* Dark ocean tiles */
L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
{
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

/* Polygon lãnh hải demo */
const maritimeZone = L.polygon([
    [8.5, 108],
    [10, 111],
    [13, 114],
    [17, 117],
    [20, 114],
    [18, 109],
    [13, 107]
], {
    color: '#00d0ff',
    weight: 2,
    fillColor: '#0077aa',
    fillOpacity: 0.25
}).addTo(map);

/* Hoàng Sa */
L.circleMarker([16.5, 112.3], {
    radius: 5,
    color: '#00ffff',
    fillColor: '#00ffff',
    fillOpacity: 1
}).addTo(map);

L.tooltip({
    permanent: true,
    direction: 'top',
    className: 'island-label'
})
.setLatLng([16.7, 112.3])
.setContent('Hoàng Sa')
.addTo(map);

/* Trường Sa */
L.circleMarker([10.2, 114.3], {
    radius: 5,
    color: '#00ffff',
    fillColor: '#00ffff',
    fillOpacity: 1
}).addTo(map);

L.tooltip({
    permanent: true,
    direction: 'top',
    className: 'island-label'
})
.setLatLng([10.4, 114.3])
.setContent('Trường Sa')
.addTo(map);

</script>

</body>
</html>
